name: daily-competition-scan

on:
  schedule:
    - cron: "23 4 * * *" # UTC 04:23 = 北京时间 12:23，错开整点调度高峰
  workflow_dispatch: {}

# 同一时刻只允许一次扫描，避免并发运行互相覆盖 data/ 状态
concurrency:
  group: daily-scan
  cancel-in-progress: true

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  scan:
    runs-on: ubuntu-latest
    # AI 情报员有 29 个种子源（并行 6 路），加各平台抓取与表格同步，留足余量
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # 测试不过就不发日报：把问题拦在推送之前
      - name: Run tests
        run: python tests/test_core.py

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install lark-cli（在线表格同步用）
        run: npm i -g @larksuite/cli

      - name: Configure lark-cli（从 Secrets 写入应用配置）
        run: |
          mkdir -p ~/.lark-cli
          python - <<'EOF'
          import json, os
          cfg = {"apps": [{"name": "jingsai",
                           "appId": os.environ["LARK_APP_ID"],
                           "appSecret": os.environ["LARK_APP_SECRET"],
                           "brand": "feishu", "users": []}]}
          open(os.path.expanduser("~/.lark-cli/config.json"), "w").write(json.dumps(cfg))
          EOF
        env:
          LARK_APP_ID: ${{ secrets.LARK_APP_ID }}
          LARK_APP_SECRET: ${{ secrets.LARK_APP_SECRET }}

      - name: Run daily scan
        run: python run_daily.py --export-csv
        env:
          # Webhook 从仓库 Secrets 读取（Settings -> Secrets and variables -> Actions）
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          # 若机器人创建时勾选了"签名校验"，把密钥也存成 secret
          FEISHU_SECRET: ${{ secrets.FEISHU_SECRET }}
          # 应用机器人发消息的目标群 chat_id（配了就用应用机器人，否则用 webhook）
          FEISHU_CHAT_ID: ${{ secrets.FEISHU_CHAT_ID }}
          # 飞书在线表格地址（必配：否则卡片降级为"本机路径"、表格不更新）
          FEISHU_SHEET_URL: ${{ secrets.FEISHU_SHEET_URL }}
          # Kaggle 账号（可选）：不配置则跳过 Kaggle
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
          # DeepSeek API Key（可选）：启用 AI 情报员 + AI 今日看点
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}

      # 生成静态网站（单文件内嵌数据），供 GitHub Pages 发布
      - name: Build site
        run: python scripts/build_site.py --sheet-url "$FEISHU_SHEET_URL"
        env:
          FEISHU_SHEET_URL: ${{ secrets.FEISHU_SHEET_URL }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Commit state back (增量去重依据)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "no state changes"
          else
            git commit -m "chore: 更新竞赛状态 [skip ci]"
            # 先拉取远端变更再推，避免与手动触发等并发提交冲突丢数据
            git pull --rebase --autostash
            git push
          fi

  deploy-pages:
    needs: scan
    if: ${{ !cancelled() && needs.scan.result == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
