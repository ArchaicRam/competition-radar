name: daily-competition-scan

on:
  schedule:
    # 每天 UTC 22:00 = 北京时间 06:00
    - cron: "0 22 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install lark-cli（在线表格同步用）
        run: npm i -g @larksuite/cli

      - name: Configure lark-cli（从 Secrets 写入应用配置）
        run: |
          mkdir -p ~/.lark-cli
          python - <<'EOF'
          import json, os
          cfg = {"apps": [{"name": "jingsai",
                           "appId": os.environ["LARK_APP_ID"],
                           "appSecret": os.environ["LARK_APP_SECRET"],
                           "brand": "feishu", "users": []}]}
          open(os.path.expanduser("~/.lark-cli/config.json"), "w").write(json.dumps(cfg))
          EOF
        env:
          LARK_APP_ID: ${{ secrets.LARK_APP_ID }}
          LARK_APP_SECRET: ${{ secrets.LARK_APP_SECRET }}

      - name: Run daily scan
        run: python run_daily.py --export-csv
        env:
          # Webhook 从仓库 Secrets 读取（Settings -> Secrets and variables -> Actions）
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          # 若机器人创建时勾选了"签名校验"，把密钥也存成 secret
          FEISHU_SECRET: ${{ secrets.FEISHU_SECRET }}
          # 飞书在线表格地址（必配：否则卡片降级为"本机路径"、表格不更新）
          FEISHU_SHEET_URL: ${{ secrets.FEISHU_SHEET_URL }}
          # Kaggle 账号（可选）：不配置则跳过 Kaggle
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
          # DeepSeek API Key（可选）：启用 AI 情报员 + AI 今日看点
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}

      - name: Commit state back (增量去重依据)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "no state changes"
          else
            git commit -m "chore: 更新竞赛状态 [skip ci]"
            git push
          fi

